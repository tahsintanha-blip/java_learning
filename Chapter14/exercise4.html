<script>

function countOccurrences(arr, target) {

    let count = 0;

    for (const value of arr) {

        if (value === target) {
            count++;
        }
    }

    return count;
}

console.log(countOccurrences([2, 5, 2, 8, 2, 9], 2));

</script>
