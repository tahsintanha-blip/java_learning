<!DOCTYPE html>
<html>
<head>
    <title>Chapter 14 Exercise 2</title>
</head>
<body>

<script>

const arr = [2, 5, 8, 12, 16, 23, 38, 56, 72, 91];

let low = 0;
let high = arr.length - 1;

while (low <= high) {

    const mid = Math.floor((low + high) / 2);

    console.log("Low:", low, "Mid:", mid, "High:", high);

    if (arr[mid] === 91) {
        console.log("Found at index:", mid);
        break;
    } else if (arr[mid] < 91) {
        low = mid + 1;
    } else {
        high = mid - 1;
    }
}

</script>

</body>
</html>
