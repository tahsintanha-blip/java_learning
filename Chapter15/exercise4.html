<script>

function bubbleSort(arr) {

    const a = [...arr];

    for (let i = 0; i < a.length - 1; i++) {

        let swapped = false;

        for (let j = 0; j < a.length - 1 - i; j++) {

            if (a[j] > a[j + 1]) {

                [a[j], a[j + 1]] = [a[j + 1], a[j]];

                swapped = true;
            }
        }

        if (!swapped) {
            break;
        }
    }

    return a;
}

console.log(bubbleSort([1, 2, 3, 4, 5]));
