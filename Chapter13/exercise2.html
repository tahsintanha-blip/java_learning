<script>

const numbers = [10, 5, 25, 8, 15];

// Version 1: Using a loop
function findMaxLoop(arr) {

    let maximum = arr[0];

    for (let i = 1; i < arr.length; i++) {

        if (arr[i] > maximum) {
            maximum = arr[i];
        }

    }

    return maximum;
}


// Version 2: Using sort()
function findMaxSort(arr) {

    const sorted = [...arr].sort((a, b) => a - b);

    return sorted[sorted.length - 1];
}


console.log("Maximum using loop:", findMaxLoop(numbers));

console.log("Maximum using sort():", findMaxSort(numbers));

console.log("Loop complexity: O(n)");

console.log("Sort complexity: O(n log n)");

</script>
