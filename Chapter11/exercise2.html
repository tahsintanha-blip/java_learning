<body>

<script>

function parseUser(text) {

    try {

        const user = JSON.parse(text);

        return "Welcome, " + user.name;

    } catch (error) {

        return "Sorry, the data is invalid.";

    }

}

console.log(parseUser('{"name":"Tanha"}'));

console.log(parseUser("{broken json}"));

</script>

</body>
