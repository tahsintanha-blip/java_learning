<!DOCTYPE html>
<html>
<head>
    <title>Grade Calculator</title>
</head>
<body>

<script type="module">

    function calculateGrade(marks) {

        const total = marks.reduce((sum, mark) => sum + mark, 0);
        const average = total / marks.length;

        if (average >= 80) {
            return "A+";
        } else if (average >= 70) {
            return "A";
        } else if (average >= 60) {
            return "B";
        } else if (average >= 50) {
            return "C";
        } else {
            return "F";
        }
    }

    const marks = [80, 75, 90];

    console.log("Grade:", calculateGrade(marks));

</script>

</body>
</html>
