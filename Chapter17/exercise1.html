<script>

function sumTo(n) {

    if (n === 1) {
        return 1;
    }

    return n + sumTo(n - 1);
}

function sumToLoop(n) {

    let sum = 0;

    for (let i = 1; i <= n; i++) {
        sum += i;
    }

    return sum;
}

console.log("Recursive:", sumTo(5));
console.log("Loop:", sumToLoop(5));

</script>
