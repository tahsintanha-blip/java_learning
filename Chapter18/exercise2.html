<script>

class Node {
    constructor(value) {
        this.value = value;
        this.left = null;
        this.right = null;
    }
}

class BST {

    constructor() {
        this.root = null;
    }

    insert(value) {

        const newNode = new Node(value);

        if (this.root === null) {
            this.root = newNode;
            return;
        }

        let current = this.root;

        while (true) {

            if (value < current.value) {

                if (current.left === null) {
                    current.left = newNode;
                    return;
                }

                current = current.left;

            } else {

                if (current.right === null) {
                    current.right = newNode;
                    return;
                }

                current = current.right;
            }
        }
    }

    min() {

        let current = this.root;

        while (current.left !== null) {
            current = current.left;
        }

        return current.value;
    }
}

const tree = new BST();

tree.insert(15);
tree.insert(10);
tree.insert(20);
tree.insert(8);
tree.insert(12);

console.log("Minimum:", tree.min());

</script>

</body>
